name: Publish Content Type E2E image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches:
      - master
    paths:
      - docker/ct-e2e/**
      - .github/workflows/publish-ct-e2e-image.yml

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE: ghcr.io/h5p/ct-e2e

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read image tag from Dockerfile
        working-directory: docker/ct-e2e
        run: |
          PLAYWRIGHT=$(sed -n 's|^FROM mcr.microsoft.com/playwright:v\([^-]*\).*|\1|p' Dockerfile)
          REF=$(sed -n 's/^ARG H5P_CLI_REF=//p' Dockerfile)
          echo "PLAYWRIGHT=$PLAYWRIGHT" >> "$GITHUB_ENV"
          echo "CLI_SHORT=${REF:0:8}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ct-e2e
          push: true
          tags: |
            ${{ env.IMAGE }}:playwright-${{ env.PLAYWRIGHT }}-cli-${{ env.CLI_SHORT }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
